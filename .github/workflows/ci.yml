name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/GraduateRecords.Web/package-lock.json

      - name: Restore NuGet
        run: dotnet restore GraduateRecords.sln

      - name: Install npm packages
        working-directory: src/GraduateRecords.Web
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: src/GraduateRecords.Web
        run: npm run build:css

      - name: Build
        run: dotnet build GraduateRecords.sln -c Release --no-restore

      - name: Test
        run: dotnet test GraduateRecords.sln -c Release --no-build --verbosity normal
